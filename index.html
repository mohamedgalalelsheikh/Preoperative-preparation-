<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تجهيز العمليات">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>تجهيز ما قبل العمليات</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: one narrow working column; list of cases grouped by operation family, editor as a single scroll with a sticky action bar */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#F6F8F7; --ink:#15231F; --muted:#5B6B65; --line:#D6DEDA;
  --accent:#0E6B5C; --accent-ink:#FFFFFF; --accent-soft:#DCEFEA;
  --ok:#1D7A46; --ok-bg:#E3F3EA; --bad:#B42318; --bad-bg:#FCEBE9; --warn:#9A5B00; --warn-bg:#FFF3DE;
  --paper:#FFFFFF; --paper-ink:#15231F; --paper-muted:#5B6B65; --paper-line:#CCD6D2; --paper-accent:#0E6B5C;
  --paper-bad:#B42318; --paper-bad-bg:#FCEBE9; --paper-ok:#1D7A46; --paper-ok-bg:#E3F3EA; --paper-sunk:#F3F6F5;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1613; --surface:#16211D; --sunk:#111B18; --ink:#E4EDE9; --muted:#93A49E; --line:#283631;
  --accent:#42B8A0; --accent-ink:#06231D; --accent-soft:#183A33;
  --ok:#57C887; --ok-bg:#123222; --bad:#FF8273; --bad-bg:#3A1714; --warn:#F2AE4B; --warn-bg:#3A2A10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16211D; --sunk:#111B18; --ink:#E4EDE9; --muted:#93A49E; --line:#283631;
  --accent:#42B8A0; --accent-ink:#06231D; --accent-soft:#183A33;
  --ok:#57C887; --ok-bg:#123222; --bad:#FF8273; --bad-bg:#3A1714; --warn:#F2AE4B; --warn-bg:#3A2A10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:12px}
.top h1{font-size:20px;flex:1;min-width:0}
.top .sub{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn[disabled]{opacity:.55;cursor:progress}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}

/* summary */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:4px 14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.stat.bad b{color:var(--bad)} .stat.ok b{color:var(--ok)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group-h{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 8px;font-size:15px;color:var(--muted)}
.group-h h2{font-size:15px;color:var(--ink)}
.cards{display:grid;gap:8px}
.card{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:start;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;border-inline-start:4px solid var(--bad)}
.card.ready{border-inline-start-color:var(--ok)}
.card .nm{font-weight:600;font-size:16px;min-width:0;overflow-wrap:anywhere}
.card .meta{grid-column:1/2;font-size:13px;color:var(--muted);min-width:0}
.pill{grid-row:1/3;grid-column:2;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.ok{background:var(--ok-bg);color:var(--ok)}
.tag{font-size:11px;background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:1px 6px;margin-inline-start:6px;font-weight:600;vertical-align:middle}
.empty{text-align:center;color:var(--muted);padding:40px 12px;border:1px dashed var(--line);border-radius:var(--r)}
.note{font-size:13px;color:var(--muted);margin-top:14px}

/* editor */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.sec>h2{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
@media (max-width:480px){.grid{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
.in{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 10px;font-size:15px;color:var(--ink);min-width:0}
textarea.in{min-height:70px;resize:vertical}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--sunk);padding:9px 6px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tg{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 12px;font-size:13px}
.tg[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);font-weight:600}
.alarm{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-weight:500}
.alarm.bad{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.alarm.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.alarm .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:currentColor}
.alarm .ic span{color:var(--surface)}
.alarm .tx{min-width:0}
.alarm small{display:block;font-weight:400;opacity:.9;margin-top:2px}
.invh{font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:600;margin:14px 0 6px;text-transform:uppercase}
.invh:first-of-type{margin-top:0}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px;border-radius:8px;border:1px solid transparent}
.row+.row{margin-top:4px}
.row.miss{background:var(--bad-bg);border-color:var(--bad)}
.row .n{min-width:0}
.row .n b{display:block;font-weight:600;font-size:14px;direction:ltr;text-align:right;overflow-wrap:anywhere}
.row .n i{font-style:normal;font-size:12px;color:var(--muted)}
.row.miss .n b::after{content:" ناقص";color:var(--bad);font-size:11px;font-weight:700;direction:rtl;unicode-bidi:isolate}
.row .opt{font-size:11px;color:var(--warn);font-weight:600}
.row .seg{min-width:0}
.row .seg button{padding:6px 9px;font-size:12px}
.row .seg button.m[aria-pressed="true"]{background:var(--bad);color:var(--surface)}
.row .seg button.o[aria-pressed="true"]{background:var(--ok);color:var(--surface)}
.row .seg button.x[aria-pressed="true"]{background:var(--muted);color:var(--surface)}
.row .res{grid-column:1/-1}
@media (max-width:420px){.row{grid-template-columns:1fr}.row .seg{width:100%}}
.autocomment{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:10px;white-space:pre-line}
.bar{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .wrap{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.msg{margin:10px 0 0;font-size:13px;padding:10px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn)}
.preview-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);padding:10px}

/* the PDF sheet (always paper colors) */
.sheet{background:var(--paper);color:var(--paper-ink);font-family:var(--f-body);font-size:12.5px;line-height:1.55;padding:28px 30px;direction:rtl;min-width:620px}
.sheet.capture{position:fixed;left:-10000px;top:0;width:794px;min-height:1123px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--paper-accent);padding-bottom:10px;margin-bottom:14px;gap:16px}
.sh-head .dr{font-family:var(--f-display);font-size:18px;color:var(--paper-accent);font-weight:600}
.sh-head .dr small{display:block;font-family:var(--f-body);font-size:11px;color:var(--paper-muted);font-weight:400}
.sh-head .ttl{text-align:left;font-family:var(--f-display);font-size:16px;font-weight:600}
.sh-head .ttl small{display:block;font-family:var(--f-body);font-size:11px;color:var(--paper-muted);font-weight:400}
.sh-pt{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--paper-line);border-radius:6px;overflow:hidden;margin-bottom:12px}
.sh-pt div{padding:6px 9px;border-bottom:1px solid var(--paper-line);border-inline-start:1px solid var(--paper-line)}
.sh-pt div.w2{grid-column:span 2} .sh-pt div.w4{grid-column:span 4}
.sh-pt span{display:block;font-size:10px;color:var(--paper-muted)}
.sh-pt b{font-weight:600}
.sh-status{padding:8px 12px;border-radius:6px;font-weight:600;margin-bottom:12px;font-size:13px}
.sh-status.bad{background:var(--paper-bad-bg);color:var(--paper-bad);border:1px solid var(--paper-bad)}
.sh-status.ok{background:var(--paper-ok-bg);color:var(--paper-ok);border:1px solid var(--paper-ok)}
.sheet h3{font-size:13px;margin:12px 0 6px;color:var(--paper-accent)}
.sheet table{width:100%;border-collapse:collapse}
.sheet th,.sheet td{border:1px solid var(--paper-line);padding:5px 8px;text-align:right;vertical-align:top}
.sheet th{background:var(--paper-sunk);font-size:11px;color:var(--paper-muted);font-weight:600}
.sheet td.en{direction:ltr;text-align:left}
.sheet tr.m td{background:var(--paper-bad-bg);color:var(--paper-bad);font-weight:600}
.sheet td.st{width:80px;text-align:center;font-weight:600}
.sheet .ok{color:var(--paper-ok)}
.sh-comment{border:2px solid var(--paper-ink);border-radius:6px;padding:10px 12px;margin-top:14px}
.sh-comment h3{margin-top:0;color:var(--paper-ink)}
.sh-comment p{margin:0;white-space:pre-line}
.sh-foot{margin-top:18px;border-top:1px solid var(--paper-line);padding-top:8px;font-size:10.5px;color:var(--paper-muted);display:flex;justify-content:space-between;gap:12px}
@media (prefers-reduced-motion:no-preference){.card,.btn,.chip{transition:background .15s,border-color .15s}}
</style>
</head>

};
const TYPES=[["lab","تحاليل معملية"],["rad","أشعة"],["eval","تقييم وموافقات"]];
const COMMON=["cbc","coag","renal","rbs","viral","ua","ecg","anes","consent"];
const MAJOR=["cbc","coag","renal","rbs","viral","ua","ecg","anes","consent","lytes","lft","bg","cxr","echo"];
const PROCS={

 hydro:{n:"Hydrocelectomy",a:"استئصال القيلة المائية",req:["scrus"],opt:[]}
};
const GROUPS=[["البروستاتا",["holep","turp","radpros"]],["الحصوات",["urs","pcnl","eswl"]],["الكلى",["lapneph","openneph","renalcyst"]],["المثانة",["turbt","bcg","radcyst","cysto"]],["الجراحات التناسلية والعقم",["varico","tese","hydro"]]];
const CO=[["dm","سكري","hba1c"],["htn","ضغط",null],["cardiac","أمراض قلب","echo,cardio"],["ac","أدوية سيولة","ac"],["ckd","قصور كلوي","nephro,lytes"],["chest","أمراض صدرية","chest,cxr"]];
const HOSP=["Welcare","مستشفى الصفا","المستشفى الفرنساوي","مستشفى الأفق","معهد ناصر","القصر العيني"];
const DR={name:"أ.د. محمد جلال الشيخ",title:"أستاذ جراحة المسالك البولية والتناسلية – كلية طب قصر العيني",foot:"عيادة فيصل: ٢٠ شارع فيصل · ٠١٠٢٠٨٥٧٢٧٢"};

/* ---------- state ---------- */
const KEY="preop.v1";
let patients=[],view={name:"list",id:null,filter:"all"},pdfBlob=null,pdfName="";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
function save(){try{localStorage.setItem(KEY,JSON.stringify(patients))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r){patients=JSON.parse(r);return}}catch(e){} patients=seed();save()}
function dPlus(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function seed(){
 const ex=(o)=>Object.assign({id:uid(),example:true,sex:"m",phone:"",fileNo:"",co:{},inv:{},comment:""},o);
 return[
  ex({name:"مثال: الحاج عبد الرحمن سالم",age:68,hospital:"Welcare",date:dPlus(3),proc:"holep",dx:"تضخم حميد بالبروستاتا ١١٠ سم³ مع احتباس متكرر",co:{dm:true,ac:true},
   inv:{cbc:{s:"ok",r:"Hb 13.1"},coag:{s:"ok",r:"INR 1.0"},renal:{s:"ok",r:"Cr 1.1"},rbs:{s:"ok",r:"162"},viral:{s:"ok",r:"Negative"},ua:{s:"ok"},ecg:{s:"ok"},lytes:{s:"ok"},psa:{s:"ok",r:"5.8 / F:T 0.24"},trus:{s:"ok",r:"110 cc, PVR 180 ml"},us:{s:"ok"},bg:{s:"ok",r:"A+"},ipss:{s:"ok",r:"27"}}}),
  ex({name:"مثال: محمود فتحي",age:44,hospital:"مستشفى الصفا",date:dPlus(5),proc:"pcnl",dx:"حصوة قرنية بالكلية اليسرى ٣ سم",phone:"",
   inv:Object.fromEntries(["cbc","coag","renal","rbs","viral","ua","ecg","anes","consent","lytes","uc","bg","xm2","nct","us","kub","cxr"].map(k=>[k,{s:"ok"}]))}),
  ex({name:"مثال: أحمد يحيى (اليمن)",age:33,hospital:"المستشفى الفرنساوي",date:dPlus(9),proc:"tese",dx:"انعدام الحيوانات المنوية غير الانسدادي",
   inv:{semen:{s:"ok",r:"Azoospermia ×2"},horm:{s:"ok",r:"FSH 24"},cbc:{s:"ok"},viral:{s:"ok"}}})
 ];
}

/* ---------- logic ---------- */
function items(p){
 const pr=PROCS[p.proc];if(!pr)return[];
 const req=[...(pr.base||COMMON),...pr.req];
 CO.forEach(([k,,add])=>{if(add&&p.co&&p.co[k])req.push(...add.split(","))});
 if(p.sex==="f"&&(+p.age||30)>=12&&(+p.age||30)<=55)req.push("bhcg");
 const seen=new Set(),out=[];
 req.forEach(k=>{if(!seen.has(k)&&INV[k]){seen.add(k);out.push({k,req:true})}});
 pr.opt.forEach(k=>{if(!seen.has(k)&&INV[k]){seen.add(k);out.push({k,req:false})}});
 return out;
}
function status(p,it){const v=p.inv[it.k];return v&&v.s?v.s:(it.req?"miss":"na")}
function missing(p){return items(p).filter(it=>status(p,it)==="miss")}
function groupOf(proc){return GROUPS.findIndex(g=>g[1].includes(proc))}
function fmtDate(d){if(!d)return"لم يحدد";try{return new Date(d+"T12:00").toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}catch(e){return d}}
function procName(k){const p=PROCS[k];return p?`${p.a} (${p.n})`:""}
function autoComment(p){
 const m=missing(p);
 if(!m.length)return"جميع الفحوصات المطلوبة متوفرة، والحالة جاهزة للعملية.";
 return`الحالة غير مكتملة. المطلوب استكماله قبل العملية (${m.length}):\n`+m.map(it=>`• ${INV[it.k].a} – ${INV[it.k].n}`).join("\n");
}

/* ---------- list view ---------- */
function renderList(){
 const f=view.filter;
 const list=patients.filter(p=>f==="all"||String(groupOf(p.proc))===f).sort((a,b)=>(a.date||"9").localeCompare(b.date||"9"));
 const ready=patients.filter(p=>!missing(p).length).length;
 let h=`<header class="top"><h1>تجهيز ما قبل العمليات<span class="sub">${esc(DR.name)}</span></h1><button class="btn primary" id="add">+ مريض جديد</button></header>
 <div class="summary"><div class="stat"><b>${patients.length}</b><span>حالات مسجلة</span></div><div class="stat ok"><b>${ready}</b><span>جاهزة للعملية</span></div><div class="stat bad"><b>${patients.length-ready}</b><span>بها نواقص</span></div></div>
 <div class="chips" role="toolbar"><button class="chip" data-f="all" aria-pressed="${f==="all"}">الكل</button>${GROUPS.map((g,i)=>`<button class="chip" data-f="${i}" aria-pressed="${f===String(i)}">${g[0]}</button>`).join("")}</div>`;
 if(!list.length)h+=`<div class="empty">لا توجد حالات في هذا القسم.<br>اضغط «+ مريض جديد» لإضافة أول حالة.</div>`;
 GROUPS.forEach((g,gi)=>{
  const ps=list.filter(p=>groupOf(p.proc)===gi);if(!ps.length)return;
  h+=`<div class="group-h"><h2>${g[0]}</h2><span>${ps.length}</span></div><div class="cards">`+ps.map(p=>{
   const m=missing(p).length;
   return`<button class="card ${m?"":"ready"}" data-id="${p.id}"><span class="nm">${esc(p.name||"بدون اسم")}${p.example?'<span class="tag">مثال</span>':""}</span>
   <span class="pill ${m?"bad":"ok"}">${m?`ناقص ${m}`:"جاهز"}</span>
   <span class="meta">${esc(PROCS[p.proc]?.n||"")} · ${esc(p.hospital||"")} · ${esc(fmtDate(p.date))}</span></button>`}).join("")+`</div>`;
 });
 if(patients.some(p=>p.example))h+=`<p class="note">الحالات المعلّمة «مثال» للتوضيح فقط. <button class="link" id="clearEx">حذف الأمثلة</button></p>`;
 h+=`<p class="note">تُحفظ الحالات على هذا الجهاز فقط.</p>`;
 $("app").innerHTML=h;
 $("add").onclick=()=>{const p={id:uid(),name:"",age:"",sex:"m",phone:"",fileNo:"",hospital:HOSP[0],date:dPlus(7),proc:"holep",dx:"",co:{},inv:{},comment:""};patients.unshift(p);save();open(p.id)};
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{view.filter=b.dataset.f;renderList()});
 document.querySelectorAll(".card").forEach(b=>b.onclick=()=>open(b.dataset.id));
 const ce=$("clearEx");if(ce)ce.onclick=()=>{patients=patients.filter(p=>!p.example);save();renderList()};
}
function open(id){view.name="edit";view.id=id;pdfBlob=null;renderEdit();window.scrollTo(0,0)}
function cur(){return patients.find(p=>p.id===view.id)}

/* ---------- editor ---------- */
function renderEdit(){
 const p=cur();if(!p){view.name="list";return renderList()}
 const opt=GROUPS.map(([g,ks])=>`<optgroup label="${g}">`+ks.map(k=>`<option value="${k}" ${p.proc===k?"selected":""}>${PROCS[k].a} – ${PROCS[k].n}</option>`).join("")+`</optgroup>`).join("");
 const hosp=[...new Set([...HOSP,p.hospital].filter(Boolean))].map(h=>`<option ${p.hospital===h?"selected":""}>${esc(h)}</option>`).join("");
 $("app").innerHTML=`<header class="top"><button class="btn" id="back" aria-label="رجوع">→ الحالات</button><h1 id="hdrName">${esc(p.name||"حالة جديدة")}</h1></header>
 <div id="alarm"></div>
 <section class="sec"><h2>بيانات المريض</h2><div class="grid">
  <label class="f full">الاسم<input class="in" id="f_name" value="${esc(p.name)}" dir="auto"></label>
  <label class="f">السن<input class="in" id="f_age" inputmode="numeric" value="${esc(p.age)}"></label>
  <div class="f" style="display:grid;gap:4px;font-size:13px;color:var(--muted)">النوع<div class="seg" id="sex"><button type="button" data-v="m" aria-pressed="${p.sex!=="f"}">ذكر</button><button type="button" data-v="f" aria-pressed="${p.sex==="f"}">أنثى</button></div></div>
  <label class="f">رقم واتساب<input class="in" id="f_phone" inputmode="tel" dir="ltr" placeholder="01xxxxxxxxx أو +966…" value="${esc(p.phone)}"></label>
  <label class="f">رقم الملف<input class="in" id="f_fileNo" value="${esc(p.fileNo)}" dir="auto"></label>
  <label class="f">المستشفى<select class="in" id="f_hospital">${hosp}</select></label>
  <label class="f">موعد العملية<input class="in" type="date" id="f_date" value="${esc(p.date)}"></label>
  <label class="f full">العملية المخططة<select class="in" id="f_proc">${opt}</select></label>
  <label class="f full">التشخيص / دواعي العملية<textarea class="in" id="f_dx" dir="auto">${esc(p.dx)}</textarea></label>
 </div></section>
 <section class="sec"><h2>الأمراض المصاحبة</h2><div class="toggles" id="co">${CO.map(([k,l])=>`<button type="button" class="tg" data-k="${k}" aria-pressed="${!!p.co[k]}">${l}</button>`).join("")}</div>
 <p class="note" style="margin-top:8px">كل اختيار يضيف فحوصاته المطلوبة تلقائيًا.</p></section>
 <section class="sec"><h2>الفحوصات المطلوبة <span id="procLbl" style="font-size:13px;color:var(--muted);font-weight:500"></span></h2><div id="inv"></div></section>
 <section class="sec"><h2>التعليق الختامي</h2><div class="autocomment" id="auto"></div>
  <label class="f">تعليق إضافي من الطبيب<textarea class="in" id="f_comment" dir="auto" placeholder="مثال: إيقاف الأسبرين ٥ أيام قبل العملية، الحضور صائمًا ٨ ساعات">${esc(p.comment)}</textarea></label></section>
 <section class="sec"><h2>ورقة PDF</h2><div class="preview-wrap"><div class="sheet" id="sheetPrev"></div></div></section>
 <section class="sec"><h2>حذف الحالة</h2><button class="btn danger" id="del">حذف هذه الحالة</button></section>
 <div class="bar"><div class="wrap"><button class="btn primary" id="mkPdf">إنشاء PDF</button><button class="btn" id="shPdf" disabled>إرسال PDF عبر واتساب</button><a class="btn" id="waTxt" target="_blank" rel="noopener">إرسال النواقص كرسالة</a></div><div class="wrap"><div id="msg"></div></div></div>`;
 $("back").onclick=()=>{view.name="list";renderList();window.scrollTo(0,0)};
 ["name","age","phone","fileNo","hospital","date","proc","dx","comment"].forEach(k=>{
  const el=$("f_"+k);el.addEventListener(el.tagName==="SELECT"||el.type==="date"?"change":"input",()=>{p[k]=el.value;p.example=false;save();changed(k)});
 });
 document.querySelectorAll("#sex button").forEach(b=>b.onclick=()=>{p.sex=b.dataset.v;save();document.querySelectorAll("#sex button").forEach(x=>x.setAttribute("aria-pressed",x===b));changed("sex")});
 document.querySelectorAll("#co .tg").forEach(b=>b.onclick=()=>{p.co[b.dataset.k]=!p.co[b.dataset.k];b.setAttribute("aria-pressed",!!p.co[b.dataset.k]);save();changed("co")});
 const del=$("del");del.onclick=()=>{if(!del.classList.contains("armed")){del.classList.add("armed");del.textContent="اضغط مرة أخرى لتأكيد الحذف";setTimeout(()=>{del.classList.remove("armed");del.textContent="حذف هذه الحالة"},4000);return}
  patients=patients.filter(x=>x.id!==p.id);save();view.name="list";renderList()};
 $("mkPdf").onclick=makePdf;$("shPdf").onclick=sharePdf;
 renderInv();refresh();
}
function changed(k){
 pdfBlob=null;$("shPdf").disabled=true;
 if(k==="name")$("hdrName").textContent=cur().name||"حالة جديدة";
 if(["proc","co","sex","age"].includes(k))renderInv();
 refresh();
}
function renderInv(){
 const p=cur(),its=items(p);
 $("procLbl").textContent="· "+(PROCS[p.proc]?.n||"");
 $("inv").innerHTML=TYPES.map(([t,l])=>{
  const rows=its.filter(it=>INV[it.k].t===t);if(!rows.length)return"";
  return`<div class="invh">${l}</div>`+rows.map(it=>{
   const s=status(p,it),d=INV[it.k],r=p.inv[it.k]?.r||"";
   return`<div class="row ${s==="miss"?"miss":""}" data-k="${it.k}" data-req="${it.req}">
    <div class="n"><b>${esc(d.n)}</b><i>${esc(d.a)}</i>${it.req?"":' <span class="opt">· حسب الحالة</span>'}</div>
    <div class="seg"><button type="button" class="o" data-s="ok" aria-pressed="${s==="ok"}">متوفر</button><button type="button" class="m" data-s="miss" aria-pressed="${s==="miss"}">ناقص</button><button type="button" class="x" data-s="na" aria-pressed="${s==="na"}">لا يلزم</button></div>
    ${s==="ok"?`<input class="in res" data-r="${it.k}" dir="auto" placeholder="النتيجة (اختياري)" value="${esc(r)}">`:""}</div>`}).join("");
 }).join("");
 document.querySelectorAll("#inv .seg button").forEach(b=>b.onclick=()=>{
  const k=b.closest(".row").dataset.k;p.inv[k]=Object.assign(p.inv[k]||{},{s:b.dataset.s});p.example=false;save();pdfBlob=null;$("shPdf").disabled=true;renderInv();refresh();
 });
 document.querySelectorAll("#inv input[data-r]").forEach(el=>el.oninput=()=>{const k=el.dataset.r;p.inv[k]=Object.assign(p.inv[k]||{s:"ok"},{r:el.value});save();pdfBlob=null;$("shPdf").disabled=true;refresh(false)});
}
function refresh(){
 const p=cur(),m=missing(p);
 $("alarm").innerHTML=m.length
  ?`<div class="alarm bad" role="alert"><span class="ic"><span>!</span></span><div class="tx">ناقص ${m.length} من الفحوصات المطلوبة<small>${m.map(it=>esc(INV[it.k].n)).join(" · ")}</small></div></div>`
  :`<div class="alarm ok"><span class="ic"><span>✓</span></span><div class="tx">الحالة جاهزة للعملية<small>كل الفحوصات المطلوبة متوفرة.</small></div></div>`;
 $("auto").textContent=autoComment(p);
 $("sheetPrev").innerHTML=sheetHTML(p);
 $("waTxt").href=waLink(p);
}

/* ---------- sheet / PDF / WhatsApp ---------- */
function sheetHTML(p){
 const its=items(p),m=missing(p);
 const co=CO.filter(([k])=>p.co[k]).map(([,l])=>l).join("، ")||"لا يوجد";
 const today=new Date().toLocaleDateString("ar-EG",{day:"numeric",month:"long",year:"numeric"});
 const tables=TYPES.map(([t,l])=>{
  const rows=its.filter(it=>INV[it.k].t===t);if(!rows.length)return"";
  return`<h3>${l}</h3><table><tr><th>الفحص</th><th>البيان</th><th>الحالة</th><th>النتيجة</th></tr>`+rows.map(it=>{
   const s=status(p,it),d=INV[it.k];
   return`<tr class="${s==="miss"?"m":""}"><td class="en">${esc(d.n)}</td><td>${esc(d.a)}</td><td class="st ${s==="ok"?"ok":""}">${s==="ok"?"متوفر":s==="miss"?"ناقص":"لا يلزم"}</td><td>${esc(p.inv[it.k]?.r||"")}</td></tr>`}).join("")+`</table>`;
 }).join("");
 return`<div class="sh-head"><div class="dr">${esc(DR.name)}<small>${esc(DR.title)}</small></div><div class="ttl">تجهيز ما قبل العملية<small>${today}</small></div></div>
 <div class="sh-pt">
  <div class="w2"><span>اسم المريض</span><b>${esc(p.name||"—")}</b></div><div><span>السن / النوع</span><b>${esc(p.age||"—")} · ${p.sex==="f"?"أنثى":"ذكر"}</b></div><div><span>رقم الملف</span><b>${esc(p.fileNo||"—")}</b></div>
  <div class="w2"><span>العملية المخططة</span><b>${esc(procName(p.proc))}</b></div><div><span>المستشفى</span><b>${esc(p.hospital||"—")}</b></div><div><span>موعد العملية</span><b>${esc(fmtDate(p.date))}</b></div>
  <div class="w2"><span>التشخيص</span><b>${esc(p.dx||"—")}</b></div><div class="w2"><span>الأمراض المصاحبة</span><b>${esc(co)}</b></div>
 </div>
 <div class="sh-status ${m.length?"bad":"ok"}">${m.length?`غير مكتمل: ناقص ${m.length} من الفحوصات المطلوبة`:"مكتمل: الحالة جاهزة للعملية"}</div>
 ${tables}
 <div class="sh-comment"><h3>التعليق الختامي</h3><p>${esc(autoComment(p))}${p.comment?"\n\n"+esc(p.comment):""}</p></div>
 <div class="sh-foot"><span>${esc(DR.foot)}</span><span>${esc(DR.name)}</span></div>`;
}
function normPhone(s){let d=String(s||"").replace(/[^\d+]/g,"");if(d.startsWith("+"))return d.slice(1);if(d.startsWith("00"))return d.slice(2);if(/^01\d{9}$/.test(d))return"20"+d.slice(1);return d}
function waText(p){
 const m=missing(p);
 let t=`*${DR.name}*\nتجهيز ما قبل العملية\n\nالمريض: ${p.name||""}\nالعملية: ${procName(p.proc)}\nالمستشفى: ${p.hospital||""}\nالموعد: ${fmtDate(p.date)}\n\n`;
 t+=m.length?`المطلوب استكماله قبل العملية:\n`+m.map(it=>`• ${INV[it.k].a} (${INV[it.k].n})`).join("\n"):"جميع الفحوصات المطلوبة متوفرة، والحالة جاهزة للعملية.";
 if(p.comment)t+=`\n\nملاحظات: ${p.comment}`;
 return t;
}
function waLink(p){const n=normPhone(p.phone);return`https://wa.me/${n}?text=${encodeURIComponent(waText(p))}`}
function say(t){$("msg").innerHTML=t?`<p class="msg">${t}</p>`:""}
async function makePdf(){
 const p=cur(),btn=$("mkPdf");
 if(!window.html2canvas||!window.jspdf){say("تعذّر تحميل أداة PDF. تأكد من الاتصال بالإنترنت ثم أعد المحاولة.");return}
 btn.disabled=true;btn.textContent="جارٍ الإنشاء…";say("");
 const node=document.createElement("div");node.className="sheet capture";node.innerHTML=sheetHTML(p);$("capture").appendChild(node);
 try{
  if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const canvas=await html2canvas(node,{scale:2,backgroundColor:"#ffffff",useCORS:true,windowWidth:794});
  const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:"pt",format:"a4"});
  const pw=pdf.internal.pageSize.getWidth(),ph=pdf.internal.pageSize.getHeight();
  const pagePx=Math.floor(canvas.width*ph/pw);
  for(let y=0,i=0;y<canvas.height;y+=pagePx,i++){
   const c=document.createElement("canvas");c.width=canvas.width;c.height=Math.min(pagePx,canvas.height-y);
   const g=c.getContext("2d");g.fillStyle="#ffffff";g.fillRect(0,0,c.width,c.height);g.drawImage(canvas,0,-y);
   if(i)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",.92),"JPEG",0,0,pw,c.height*pw/c.width);
  }
  pdfBlob=pdf.output("blob");pdfName=`تجهيز ${p.name||"مريض"} - ${PROCS[p.proc].n}.pdf`.replace(/[\\/:*?"<>|]/g,"-");
  $("shPdf").disabled=false;say("تم إنشاء الملف. اضغط «إرسال PDF عبر واتساب» ثم اختر واتساب من قائمة المشاركة.");
 }catch(e){say("تعذّر إنشاء الملف: "+esc(e.message||e))}
 finally{node.remove();btn.disabled=false;btn.textContent="إنشاء PDF"}
}
async function sharePdf(){
 if(!pdfBlob)return;
 const file=new File([pdfBlob],pdfName,{type:"application/pdf"});
 try{
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:pdfName});say("");return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=pdfName;document.body.appendChild(a);a.click();a.remove();
  say(window.self!==window.top?"المعاينة داخل Claude تمنع حفظ الملفات ومشاركتها. استخدم النسخة المرفوعة على GitHub لإرسال الـPDF، أو أرسل النواقص كرسالة نصية الآن.":"تم تنزيل الملف. أرسله من واتساب كمرفق.");
 }catch(e){if(e&&e.name==="AbortError")return;say("المشاركة غير متاحة هنا. افتح النسخة المرفوعة على GitHub من Safari، أو أرسل النواقص كرسالة نصية.")}
}

load();renderList();
</script>
</body>
